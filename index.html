main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 10px 70px;text-align:center}
h1,h2{margin:0}
.ribbon{display:inline-block;background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:2px 22px;font-weight:700;letter-spacing:.04em}
.sign{background:linear-gradient(#b27a42,#82502a);color:var(--cream);border:4px solid var(--woodE);border-radius:16px;box-shadow:0 4px 0 var(--woodE),0 8px 14px #0003;text-shadow:0 2px 0 #4a2a0e}
h1.big{display:inline-block;margin:10px 0 4px;padding:8px 26px;font-size:clamp(30px,8.5vw,64px);line-height:1.1;font-weight:900}
h2.sign{display:inline-block;padding:4px 30px;font-size:clamp(22px,6vw,34px);margin:6px 0 10px}
.tag{font-size:clamp(15px,3.6vw,20px);font-style:italic;margin:6px 0 14px}
.mu{opacity:.75}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sea);outline-offset:2px}
.pill{border-radius:999px}
.btn{background:linear-gradient(#b27a42,#82502a);color:var(--cream);border:4px solid var(--woodE);padding:10px 34px;font-size:clamp(20px,5vw,26px);font-weight:900;border-radius:16px;box-shadow:0 4px 0 var(--woodE);text-shadow:0 2px 0 #4a2a0e}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--woodE)}
.btn.sm,.btn.ghost{font-size:15px;padding:6px 14px;border-radius:14px;border-width:3px}
.btn.go{background:linear-gradient(#3cc283,#238a58);border-color:#17603c;box-shadow:0 4px 0 #17603c}
.inp{width:100%;max-width:440px;border:4px solid var(--edge);background:var(--parch);color:var(--ink);padding:14px 20px;font-size:clamp(18px,5vw,24px);text-align:center;border-radius:18px}
.tm{display:inline-block;padding:6px 16px;font-weight:700;font-size:16px;border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;min-height:38px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.box{background:var(--parch);border:3px dashed var(--edge);border-radius:18px;padding:16px 10px;box-shadow:0 3px 0 #e3c78c}
.box b{display:block;font-size:26px;margin-bottom:8px}
.chip{display:inline-block;font-style:normal;background:#d8d4cc;color:#6b665c;border-radius:999px;padding:3px 16px;font-size:16px}
.chip.on{background:#bfe9cf;color:#17603c;font-weight:700}
.found{display:inline-block;background:linear-gradient(#a8703a,#7b4a21);color:#7dffb0;border-radius:10px;padding:4px 14px;font-weight:900;font-size:18px}
.box.win{background:var(--gold);border:3px solid #c28a00;box-shadow:0 0 0 4px #fff3b0,0 6px 14px #0003}
.panel{background:var(--parch);border:3px solid var(--edge);border-radius:18px;padding:6px;display:inline-block;max-width:100%;box-shadow:0 4px 0 #e3c78c}
#grid{display:grid;grid-template-columns:repeat(15,1fr);width:min(calc(100vw - 38px),620px);touch-action:none;user-select:none;-webkit-user-select:none;gap:0}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink);font-size:clamp(13px,4.6vw,30px);border-radius:7px;line-height:1}
.c.s{background:var(--sea)}.c.f{background:var(--gold);box-shadow:inset 0 0 0 2px #e0a800}
.card{background:var(--parch);border:3px solid var(--edge);border-radius:18px;padding:12px;margin:12px auto 0;max-width:620px;box-shadow:0 3px 0 #e3c78c}
.wfh{display:inline-block;padding:4px 20px;border-radius:12px;font-weight:900;font-size:clamp(17px,4.6vw,22px)}
.wl{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;margin-top:10px}
.wl span{background:var(--gold);color:var(--ink);padding:2px 12px;border-radius:10px;font-weight:900;font-size:clamp(14px,3.8vw,17px);border:2px solid #e0a800}
.note{font-size:14px;opacity:.75;margin-top:12px}.err{color:var(--bad);font-weight:700}
#qr{display:block;width:fit-content;margin:0 auto;background:#fff;padding:8px;border-radius:14px;border:3px solid var(--edge)}
#qr svg{display:block;width:170px;height:170px}
.hostbadge{display:inline-block;background:var(--gr);color:#fff;border-radius:999px;padding:2px 14px;font-weight:700;font-size:14px;margin-top:4px}
.note,.tag,.err{background:#f8e8c2d9;border-radius:12px;padding:4px 14px;display:inline-block}
.err:empty{display:none}
.kick{margin-top:8px;font-size:13px!important;padding:3px 12px!important}
.hbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-start;min-height:44px}
.tsel{background:#f8e8c2d9;border-radius:12px;padding:4px 10px;font-size:15px;font-weight:700}
.tsel select{font:inherit;padding:2px 8px;border-radius:10px;border:3px solid var(--edge);background:var(--parch);color:var(--ink)}
.hwrap{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hmain{flex:1 1 520px;max-width:780px}
.hside{flex:0 0 auto;text-align:center}
.hbanner{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);padding:8px 24px;margin:6px 0 10px}
.hbanner .w1{font-style:italic;font-weight:400;font-size:clamp(34px,7vw,76px)}
.hbanner .w2{font-weight:900;font-size:clamp(34px,7vw,76px)}
.flag{background:#4b2a6b;border-radius:8px;padding:6px 12px;font-size:clamp(20px,3.4vw,38px);text-shadow:none}
.btn.big{font-size:clamp(28px,5vw,46px);padding:12px 64px;margin:8px 0 14px}
.hmain .boxes{grid-template-columns:repeat(3,1fr)}
@media (max-width:620px){.hmain .boxes{grid-template-columns:repeat(2,1fr)}}
.hside p{background:#f8e8c2d9;border-radius:12px;padding:4px 14px;display:table;margin:10px auto 0}

    cur.count=mine.length;cur.words=mine;cur.lastAt=lastT;return cur}).catch(()=>{})}
function forget(msg){me=null;mine=[];lastT=0;ls('wh_g',null);ls('wh_w',null);ls('wh_t',null);err=msg||'';shownKey=''}
function chkMe(){if(!me||!gLoaded||hostView)return;const g=groups['g'+me];if(!g||!g.joined||g.owner!==DID)forget('You were removed from Group '+me+'. Join again.')}
function chkEpoch(){const e=game.epoch||0;if(e===epoch)return;if(epoch!==null){mine=[];lastT=0;ls('wh_w',null)}epoch=e;ls('wh_e',String(e));if(me)pub()}

onValue(ref(db,'.info/serverTimeOffset'),s=>{off=s.val()||0});
onValue(ref(db,'game'),s=>{game=s.val()||{status:'lobby',epoch:0};if(!hostView)chkEpoch();sync()},()=>fail());
onValue(ref(db,'groups'),s=>{groups=s.val()||{};gLoaded=true;chkMe();sync()},()=>fail());
function fail(){app.innerHTML='<h1>Word Hunt</h1><p class="err">Cannot reach the game server. Check internet and Firebase rules.</p>'}
setInterval(sync,1000);

/* host access: open #host directly, without a PIN */
hostView=location.hash==='#host';
function sync(){
  const p=phase(),key=(hostView?'h':me?'g'+me:'j')+p;
  if(key!==shownKey){shownKey=key;ph=p;render();return}
  const t=$('#tm');if(t)t.textContent=p==='run'?fmt(left())+' mins left':(p==='ended'?'Time’s up':'Waiting for host');
  if(hostView)hostBoxes();
}
function render(){
  if(hostView)return renderHost();
  if(!me)return renderJoin();
  renderPlay();
}
window.addEventListener('hashchange',()=>{hostView=location.hash==='#host';shownKey='';sync()});
function renderJoin(){
  app.innerHTML=`${HEAD}
  <p style="margin-top:44px"><input class="inp pill" id="gn" inputmode="numeric" maxlength="1" placeholder="Enter your Group Number" aria-label="Group number"></p>
  <p style="margin-top:30px"><button class="btn go" id="sv">🧭 Save</button></p><p class="err" id="er">${err}</p>
  <p>The game will start once the Host starts.</p><p class="note"></p>`;
  $('#sv').onclick=async()=>{const n=+$('#gn').value,er=$('#er');if(!(n>=1&&n<=6)){er.textContent='Enter a number from 1 to 6.';return}
    const g=groups['g'+n];
    if(game.status!=='lobby'&&!(g&&g.owner===DID)){er.textContent='Game already started. You can’t join now.';return}
    if(g&&g.joined&&g.owner&&g.owner!==DID){er.textContent='Group '+n+' is already taken. Pick another group.';return}
    er.textContent='Joining…';
    try{
      const r=await runTransaction(ref(db,'groups/g'+n),cur=>{
        if(cur&&cur.joined&&cur.owner&&cur.owner!==DID)return;
        if(cur&&cur.joined&&cur.owner===DID)return cur;
        return{joined:true,owner:DID,count:0,words:[],lastAt:0}});
      if(!r.committed){er.textContent='Group '+n+' is already taken. Pick another group.';return}
      const d=r.snapshot.val()||{},sw=d.words||[];
      if(!(ls('wh_g')===String(n)&&mine.length>sw.length)){mine=sw;lastT=d.lastAt||0}
      me=n;err='';ls('wh_g',String(n));epoch=game.epoch||0;ls('wh_e',String(epoch));pub();shownKey='';sync();
    }catch(e){er.textContent='Could not join. Check internet and try again.'}};
}
function renderPlay(){
  const head=`<div class="top">${ph==='lobby'?'<button class="btn sm" id="ch">🧭 Change group</button>':'<span></span>'}<span class="tm sign" id="tm"></span><span></span></div><h2 class="sign">Group ${me}</h2>`;
  const bindCh=()=>{const c=$('#ch');if(!c)return;c.onclick=async()=>{const n=me;c.disabled=true;
    try{await runTransaction(ref(db,'groups/g'+n),cur=>{if(!cur||cur.owner!==DID)return;return{...FREE}})}catch(e){}
    forget('');sync()}};
  if(ph==='lobby'){app.innerHTML=head+`<h1 class="sign big">Get ready</h1><p>You joined Group ${me}.</p><p>The game will start once the Host starts.</p>`;bindCh();return}
  if(ph==='ended'){const r=rank(),pos=r.findIndex(x=>x.g===me)+1;
    app.innerHTML=head+`<h1 class="sign big">Game over</h1><div class="card"><p><b style="font-size:28px">${mine.length}</b> of ${TOTAL} words found</p><p class="mu">Your rank: ${pos||'-'} of ${r.length}</p><div class="wl">${mine.map(w=>`<span>${w[0]+w.slice(1).toLowerCase()}</span>`).join('')}</div></div>`;bindCh();return}
  app.innerHTML=head+`<div class="panel"><div id="grid">${G.map((row,r)=>row.map((l,c)=>`<div class="c" data-r="${r}" data-c="${c}">${l}</div>`).join('')).join('')}</div></div>
  <div class="card"><div class="wfh sign">💰 Words Found: <b id="wf">${mine.length}</b> / ${TOTAL}</div><div class="wl" id="wl"></div></div><p class="note">Drag across letters in any direction.</p>`;
  bindCh();mine.forEach(markWord);listWords();gridEvents();
}
function listWords(){const l=$('#wl');if(l)l.innerHTML=mine.map(w=>`<span>${w[0]+w.slice(1).toLowerCase()}</span>`).join('');const f=$('#wf');if(f)f.textContent=mine.length}
const cell=(r,c)=>document.querySelector(`.c[data-r="${r}"][data-c="${c}"]`);
function markWord(w){(POS[w]||[]).forEach(([r,c])=>{const e=cell(r,c);if(e)e.classList.add('f')})}
function gridEvents(){
  const gr=$('#grid');let a=null,path=[];
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.c'):null};
  const clr=()=>document.querySelectorAll('.c.s').forEach(x=>x.classList.remove('s'));
  const draw=()=>{clr();path.forEach(([r,c])=>cell(r,c).classList.add('s'))};
  gr.onpointerdown=e=>{const el=at(e);if(!el)return;a=[+el.dataset.r,+el.dataset.c];path=[a];try{gr.setPointerCapture(e.pointerId)}catch(x){}draw()};
  gr.onpointermove=e=>{if(!a)return;const el=at(e);if(!el)return;const r=+el.dataset.r,c=+el.dataset.c,dr=r-a[0],dc=c-a[1];
    if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return;
    const n=Math.max(Math.abs(dr),Math.abs(dc)),sr=Math.sign(dr),sc=Math.sign(dc);path=[];
    for(let i=0;i<=n;i++)path.push([a[0]+sr*i,a[1]+sc*i]);draw()};
  const end=()=>{if(!a)return;const s=path.map(([r,c])=>G[r][c]).join(''),rv=[...s].reverse().join('');
    const w=WORDS.find(x=>x===s||x===rv);a=null;
    if(w&&!mine.includes(w)&&phase()==='run'){mine.push(w);path.forEach(([r,c])=>cell(r,c).classList.add('f'));markWord(w);listWords();lastT=now();pub()}
    clr();path=[]};
  gr.onpointerup=end;gr.onpointercancel=end;
}
function renderHost(){
  const ended=ph==='ended',lob=ph==='lobby';
  app.innerHTML=`<div class="hbar"><button class="btn sm" id="rs">⚙️ ${wipe?'Tap again to reset':'Reset game'}</button>
    ${lob?`<label class="tsel">Time: <select id="du">${[3,5,10].map(m=>`<option value="${m*60}" ${m*60===dur?'selected':''}>${m} min</option>`).join('')}</select></label>`:`<span class="tm sign" id="tm"></span>`}</div>
  <div class="hwrap"><div class="hmain">
    <div class="sign hbanner"><span class="flag">☠️</span><span class="w1">WORD</span><span class="w2">Hunt</span></div>
    ${lob?'<p><button class="btn go big" id="st">⚓ Start</button></p>':''}
    ${ended?'<h2 class="sign" id="wn"></h2>':''}
    <div class="boxes" id="bx"></div></div>
    ${lob?'<div class="hside"><div id="qr"></div><p>Scan to join the hunt</p></div>':''}</div>
  <p class="note"></p>`;
  hostBoxes();
  $('#bx').onclick=async e=>{const b=e.target.closest('.kick');if(!b)return;const i=+b.dataset.k;
    if(kickArm!==i){kickArm=i;hostBoxes();setTimeout(()=>{if(kickArm===i){kickArm=0;hostBoxes()}},4000);return}
    kickArm=0;try{await set(ref(db,'groups/g'+i),{...FREE})}catch(x){}hostBoxes()};
  const q=$('#qr');if(q&&window.qrcode){try{const c=qrcode(0,'M');c.addData(location.href.split('#')[0]);c.make();q.innerHTML=c.createSvgTag(6,0)}catch(e){}}
  const st=$('#st');if(st){$('#du').onchange=e=>dur=+e.target.value;
    st.onclick=()=>set(ref(db,'game'),{status:'running',startAt:serverTimestamp(),dur:dur*1000,epoch:game.epoch||0}).catch(()=>{})}
  $('#rs').onclick=async()=>{if(!wipe){wipe=true;shownKey='';sync();return}wipe=false;
    const e=(game.epoch||0)+1,o={};for(let i=1;i<=6;i++)o['g'+i]={joined:false,count:0,words:[],lastAt:0};
    try{await set(ref(db,'groups'),o);await set(ref(db,'game'),{status:'lobby',epoch:e})}catch(x){}shownKey='';sync()};
}
function hostBoxes(){
  const b=$('#bx');if(!b)return;const r=rank(),top=ph==='ended'&&r.length?r[0].g:0;
  b.innerHTML=[1,2,3,4,5,6].map(i=>{const g=groups['g'+i],j=g&&g.joined;
    const st=ph==='lobby'?(j?'<em class="chip on">✔ Joined</em>':'<em class="chip">Waiting</em>'):(j?`<div class="found">💰 Words Found: ${g.count||0}</div>`:'<em class="chip">Not joined</em>');
    const kb=j?`<div><button class="btn sm kick" data-k="${i}">${kickArm===i?'Tap again to kick':'Kick'}</button></div>`:'';
    return`<div class="box ${top===i?'win':''}"><b>Group ${i}</b>${st}${kb}</div>`}).join('');
  const w=$('#wn');if(w&&top)w.textContent='🏆 Winner: Group '+top+' with '+r[0].n+' words';
}
sync();
</script></body></html>
